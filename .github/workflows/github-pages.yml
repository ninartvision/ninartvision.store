# Publishes the static site when main changes. Use this when GitHub Pages
# "Source" is set to GitHub Actions (Settings → Pages).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Drop bulky folders from artifact
        # Strip local-only dev artifacts before publishing. The repo on disk is
        # untouched — this only runs in the CI workspace. Keeps Sanity Studio
        # source (8t5h923j/, ninart-vision/) and all node_modules off Pages.
        run: |
          rm -rf 8t5h923j ninart-vision \
            ninartvision/8t5h923j ninartvision/ninart-vision 2>/dev/null || true
          rm -rf node_modules \
            ninartvision/node_modules \
            ninart-vision/node_modules \
            8t5h923j/node_modules 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and minify JS
        run: |
          npm ci
          npm run build:js

      - name: Remove node_modules from artifact
        run: rm -rf node_modules

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
