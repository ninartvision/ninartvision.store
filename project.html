  <script>
    /* ── Project loader ───────────────────────────────────────── */
    (async function loadProject() {
      const API = 'https://8t5h923j.apicdn.sanity.io/v2025-02-05/data/query/production';

      const params = new URLSearchParams(location.search);
      const rawSlug = params.get('p') || '';

      // Sanitize: allow only URL-safe slug characters
      const safeSlug = rawSlug.replace(/[^a-zA-Z0-9_\-]/g, '');

      if (!safeSlug) {
        showError('No project specified. <a href="./" class="link">Go home →</a>');
        return;
      }

      const query = encodeURIComponent(
        `*[_type == "featuredProject" && slug.current == "${safeSlug}"][0]{
          _id,
          titleKa,
          titleEn,
          "slug": slug.current,
          coverImage{ asset->{ _id, url, metadata{lqip,dimensions} }, alt },
          images[]{ asset->{ _id, url, metadata{lqip,dimensions} }, alt, _key },
          shortDescEn,
          bodyKa,
          bodyEn,
          medium,
          "size": dimensions,
          year,
          "artist": artist->{ _id, name, "slug": slug.current }
        }`
      );

      let project;
      try {
        const res  = await fetch(`${API}?query=${query}`);
        const json = await res.json();
        project = json.result;
      } catch (err) {
        showError('Failed to load project. Please try again.');
        return;
      }

      if (!project) {
        showError('Project not found. <a href="./" class="link">Go home →</a>');
        return;
      }

      populatePage(project);
    })();

    /* ── Populate page DOM ────────────────────────────────────── */
    function populatePage(p) {
      const titleEn = p.titleEn || '';
      const titleKa = p.titleKa || '';
      const displayTitle = [titleEn, titleKa].filter(Boolean).join(' – ');
      const fullTitle = titleKa ? `${titleEn} – „${titleKa}"` : titleEn;

      document.getElementById('pageTitle').textContent = `${titleEn || titleKa} | Ninart Vision`;
      document.getElementById('pageDescription').content = p.shortDescEn || '';
      document.getElementById('ogTitle').content = displayTitle || fullTitle;
      document.getElementById('ogDescription').content = p.shortDescEn || '';

      document.getElementById('fpHeroTitle').textContent = displayTitle;
      document.getElementById('fpHeroIntro').textContent = p.shortDescEn || '';

      document.getElementById('fpBodyKa').innerHTML = renderBlocks(p.bodyKa);
      document.getElementById('fpBodyEn').innerHTML = renderBlocks(p.bodyEn);

      document.getElementById('fpSpecMedium').textContent = p.medium || '—';
      document.getElementById('fpSpecSize').textContent = p.size || '—';
      document.getElementById('fpSpecYear').textContent = p.year || '—';

      if (p.artist) {
        const link = document.getElementById('projArtistLink');
        const aSlug = p.artist.slug || p.artist._id;
        link.href = `artists/artist.html?artist=${encodeURIComponent(aSlug)}`;
        link.textContent = `View ${p.artist.name}'s profile →`;
        link.style.display = '';
      }

      const coverUrl = p.coverImage?.asset?.url;
      const mainHost = document.getElementById('projMainImage');
      mainHost.innerHTML = '';
      if (coverUrl) {
        const img = document.createElement('img');
        img.id = 'mainImg';
        img.src = `${coverUrl}?auto=format&w=1200&q=85`;
        img.alt = p.coverImage?.alt || displayTitle;
        img.decoding = 'async';
        img.loading = 'eager';
        img.setAttribute('data-full', `${coverUrl}?auto=format&w=1600&q=90`);
        mainHost.appendChild(img);
        document.getElementById('ogImage').content = `${coverUrl}?auto=format&w=1200&q=85`;
      }

      const extras = p.images || [];
      if (extras.length > 0) {
        const list = document.getElementById('projGalleryList');
        extras.forEach((imgObj) => {
          const url = imgObj?.asset?.url;
          if (!url) return;
          const img = document.createElement('img');
          img.src = `${url}?auto=format&w=800&q=80`;
          img.alt = imgObj.alt || displayTitle;
          img.decoding = 'async';
          img.loading = 'lazy';
          img.setAttribute('data-full', `${url}?auto=format&w=1600&q=90`);
          list.appendChild(img);
        });
        document.getElementById('projGallerySection').style.display = '';
      }

      document.getElementById('projectLoading').style.display = 'none';
      const root = document.getElementById('projectContent');
      root.style.display = '';

      document.querySelectorAll('#projectContent [data-art-reveal]').forEach(function (el) {
        el.classList.add('is-visible');
      });

      if (window.NVProjectDetail && root) {
        window.NVProjectDetail.bindImages(root);
      }
      if (window.NVFeaturedProject) {
        window.NVFeaturedProject.init();
      }
    }

    function renderBlocks(blocks) {
      if (!Array.isArray(blocks) || !blocks.length) {
        return '<p></p>';
      }
      const html = blocks
        .filter((b) => b._type === 'block' && Array.isArray(b.children))
        .map((b) => {
          const inner = b.children
            .map((c) => {
              let t = (c.text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
              if (c.marks?.includes('strong')) t = `<strong>${t}</strong>`;
              if (c.marks?.includes('em')) t = `<em>${t}</em>`;
              return t;
            })
            .join('');
          return `<p>${inner}</p>`;
        })
        .join('');
      return html || '<p></p>';
    }

    /* ── Error state ──────────────────────────────────────────── */
    function showError(msg) {
      document.getElementById('projectLoading').innerHTML =
        `<p class="muted" style="text-align:center;">${msg}</p>`;
    }
  </script>
