<script>
// Share button
  (function () {
    const btn = document.getElementById('shareBtn');
    const msg = document.getElementById('shareMsg');
    const url = 'https://ninartvision.store/products/village-6/';
    if (!btn) return;
    btn.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: '"village"', url: url }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () {
          msg.style.display = 'block';
          setTimeout(function () { msg.style.display = 'none'; }, 3000);
        });
      }
    });
  }());
</script>
<script>
  (function () {
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('lightboxClose');
    if (!lightbox || !lightboxImg || !closeBtn) return;

    function openLightbox(imgSrc) {
      lightbox.classList.add('open');
      lightboxImg.src = imgSrc;
      document.body.style.overflow = 'hidden';
      lightbox.setAttribute('aria-hidden', 'false');
      closeBtn.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lightbox.setAttribute('aria-hidden', 'true');
    }

    document.querySelectorAll('.gallery-list img').forEach(function (img) {
      img.addEventListener('click', function () {
        openLightbox(img.getAttribute('data-full') || img.src);
      });
    });

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
    });
  }());
</script>
