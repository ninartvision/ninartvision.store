<!-- PAGE -->
<section class="section" style="padding-top:90px;">
  <div class="container">

    <!-- BACK -->
    <a href="./" class="btn btn-dark">← Back</a>

    <!-- ARTIST HEADER -->
    <div class="artist-header">
      <div class="artist-info">
        <img id="artistAvatar" class="artist-avatar" src="" alt="Artist Avatar" decoding="async" loading="lazy">
        
        <div class="artist-title-row">
          <h1 class="artist-name"></h1>
          <button class="about-toggle" id="aboutToggle">About &#9660;</button>
        </div>
        
        <!-- ABOUT ARTIST CONTENT -->
        <div id="aboutArtist" class="about-artist">
          <p id="aboutText" class="about-text"></p>
        </div>
      </div>
    </div>

    <!-- FILTER -->
    <div class="filter-tabs with-art artist-filter-tabs">
      <button class="pill" data-filter="all">ALL</button>
      <button class="pill" data-filter="sale">SALE</button>
      <button class="pill" data-filter="sold">SOLD</button>

      <div class="nv-room-preview-cta">
        <div class="nv-room-preview-cta__float">
          <div class="nv-room-preview-cta__tooltip" role="tooltip" aria-hidden="true">
            <div class="nv-room-preview-cta__bubble">
              <span class="nv-room-preview-cta__tooltip-text">მოარგეთ ნამუშევარი თქვენს ინტერიერს</span>
              <span class="nv-room-preview-cta__tooltip-arrow-char" aria-hidden="true">→</span>
            </div>
          </div>
          <a href="../room-visualizer.html" class="nv-room-preview-cta__btn" aria-label="მოარგეთ ნამუშევარი თქვენს ინტერიერს — ოთახის გადახედვა">
            <span class="nv-room-preview-cta__icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L8 7H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-1.5-3z"/><circle cx="12" cy="14" r="3.5"/></svg>
            </span>
          </a>
        </div>
      </div>
    </div>

    <!-- GRID -->
    <div class="shop-grid shop-grid-small" id="shopGrid"></div>

  </div>
</section>

<!-- PRODUCT MODAL -->
<div class="product-modal" id="productModal">
  <div class="product-modal-box">

    <button class="product-close" id="productClose" aria-label="Close">✕</button>

    <div class="product-layout">

      <div class="product-left">
        <div class="product-gallery">
          <button class="gallery-arrow left" id="galleryPrev" aria-label="Previous">‹</button>
          <img id="productImg" src="" alt="Artwork" decoding="async" loading="lazy">
          <button class="gallery-arrow right" id="galleryNext" aria-label="Next">›</button>
        </div>
      </div>

      <div class="product-right">
        <h2 id="productTitle"></h2>
        <p class="muted" id="productDesc"></p>

        <ul class="product-info">
          <li><b>Size:</b> <span id="productSize"></span></li>
          <li><b>Medium:</b> <span id="productMedium"></span></li>
          <li><b>Year:</b> <span id="productYear"></span></li>
        </ul>

        <div class="product-buy">
          <div class="product-buy__price-row">
            <div class="product-price" id="productPrice"></div>
          </div>

          <button class="morePhotosBtn" id="morePhotosBtn" type="button" aria-expanded="false">
            More photos <span class="arrow">↓</span>
          </button>

          <div class="product-thumbs-shell" id="productThumbsShell" aria-hidden="true">
            <div class="product-thumbs-shell__inner">
              <div class="product-thumbs" id="productThumbs"></div>
            </div>
          </div>

          <div class="product-modal-gift-card" id="frameSelectionCard" role="group" aria-labelledby="frameSelectionLabel">
            <div class="product-modal-gift-card__main">
              <span class="product-modal-gift-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16v11H4z"/><path d="M7.5 9.5h9v5h-9z"/></svg>
              </span>
              <div class="product-modal-gift-card__text">
                <span class="product-modal-gift-card__title" id="frameSelectionLabel">ჩარჩო</span>
                <span class="product-modal-gift-card__meta">+ 50 ₾</span>
              </div>
            </div>
            <label class="product-modal-gift-switch">
              <span class="product-modal-gift-switch__sr-only">ჩარჩო (+ 50 ₾)</span>
              <input type="checkbox" id="frameSelectionToggle" class="product-modal-gift-switch__input">
              <span class="product-modal-gift-switch__track"><span class="product-modal-gift-switch__thumb"></span></span>
            </label>
          </div>

          <div class="product-modal-gift-card" id="giftPackagingCard" role="group" aria-labelledby="giftPackagingLabel">
            <div class="product-modal-gift-card__main">
              <span class="product-modal-gift-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
              </span>
              <div class="product-modal-gift-card__text">
                <span class="product-modal-gift-card__title" id="giftPackagingLabel">სასაჩუქრე შეფუთვა</span>
                <span class="product-modal-gift-card__meta">+ 10 ₾</span>
              </div>
            </div>
            <label class="product-modal-gift-switch">
              <span class="product-modal-gift-switch__sr-only">სასაჩუქრე შეფუთვა (+ 10 ₾)</span>
              <input type="checkbox" id="giftPackagingToggle" class="product-modal-gift-switch__input">
              <span class="product-modal-gift-switch__track"><span class="product-modal-gift-switch__thumb"></span></span>
            </label>
          </div>

          <div class="product-modal-gift-card" id="courierDeliveryCard" role="group" aria-labelledby="courierDeliveryLabel">
            <div class="product-modal-gift-card__main">
              <span class="product-modal-gift-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="17" r="2.25"/><circle cx="17" cy="17" r="2.25"/><path d="M3 17h2"/><path d="M9.25 17h5.5"/><path d="M19 17h2"/><path d="M9.25 17 7 10H4"/><path d="M11 10h4.5l2.5 7"/><path d="M17.5 12H21l1 5"/></svg>
              </span>
              <div class="product-modal-gift-card__text">
                <span class="product-modal-gift-card__title" id="courierDeliveryLabel">საკურიერო მომსახურება</span>
                <span class="product-modal-gift-card__meta">+ 5 ₾</span>
              </div>
            </div>
            <label class="product-modal-gift-switch">
              <span class="product-modal-gift-switch__sr-only">საკურიერო მომსახურება (+ 5 ₾)</span>
              <input type="checkbox" id="courierDeliveryToggle" class="product-modal-gift-switch__input">
              <span class="product-modal-gift-switch__track"><span class="product-modal-gift-switch__thumb"></span></span>
            </label>
          </div>

          <button type="button" id="addToCartBtn" class="product-modal-add-cart" aria-label="Add to cart — inquire via WhatsApp">
            Add to Cart
          </button>

        </div>

      </div>

    </div>
  </div>
</div>
