<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist | Ninart Vision</title>

  <link rel="stylesheet" href="../style.min.css?v=nv20260527" />
  <link rel="icon" href="../images/favicon.webp">
  <style>
    .artist-header-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 20px;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .artist-header-wrapper {
        flex-direction: column;
        align-items: stretch;
      }
      #aboutContent {
        max-width: 100% !important;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="container header-row">

    <!-- Logo -->
    <a class="brand" href="../index.html">
      <img src="../images/logo.webp" alt="Ninart Vision Logo">
    </a>

    <!-- Desktop menu -->
    <nav class="nav desktop-nav">
      <a href="../index.html#home">Home</a>
      <a href="../index.html#support">Support a Project</a>
      <a href="../sale/shop.html">Shop</a>
      <a href="../room-visualizer.html">Room preview</a>
      <a href="index.html" class="active">Artists</a>
      <a href="../index.html#news">News</a>
      <a href="../about.html">About</a>
    </nav>

    <div class="header-tools">
    <a href="../sale/shop.html" class="header-cart" aria-label="Shopping cart">
      <span class="header-cart__surface">
        <svg class="header-cart__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.73L23 6H6"/></svg>
      </span>
      <span class="header-cart__badge is-empty" data-cart-badge aria-live="polite" aria-hidden="true"></span>
    </a>

    <!-- Mobile hamburger -->
    <button class="hamburger" id="openMenu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    </div>

  </div>
</header>

<!-- Mobile menu overlay -->
<div class="menu-overlay" id="menuOverlay">
  <button class="menu-close" id="closeMenu" aria-label="Close menu">✕</button>

  <nav class="menu-links">
    <a href="../index.html#home" class="menu-link">HOME</a>
    <a href="../index.html#support" class="menu-link">SUPPORT A PROJECT</a>
    <a href="../sale/shop.html" class="menu-link">SHOP</a>
    <a href="../room-visualizer.html" class="menu-link">ROOM PREVIEW</a>
    <a href="index.html" class="menu-link">ARTISTS</a>
    <a href="../index.html#news" class="menu-link">NEWS</a>
    <a href="../about.html" class="menu-link">ABOUT</a>
  </nav>
</div>

<!-- PAGE -->
<section class="section" style="padding-top:110px;">
  <div class="container">

    <a href="index.html" class="btn btn-dark">← Back</a>

    <div class="artist-header-wrapper">
      <!-- Left: Artist Info -->
      <div class="section-top" style="display: flex; align-items: center; gap: 20px; margin: 0;">
        <img id="artistAvatar" class="artist-avatar" src="" alt="Artist Avatar" style="width: 95px; height: 95px; border-radius: 50%; object-fit: cover; flex-shrink: 0;" decoding="async" loading="lazy">
        <div>
          <h2 class="artist-name" style="margin: 0 0 4px 0;"></h2>
          <p class="muted" style="margin: 0;">My artworks</p>
        </div>
      </div>

      <!-- Right: About Artist -->
      <div style="flex-shrink: 0;">
        <button id="aboutToggle" style="background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; white-space: nowrap;">
          About artist ▼
        </button>
        <div id="aboutContent" style="display: none; margin-top: 12px; background: #f9f9f9; padding: 16px; border-radius: 12px; max-width: 400px; position: relative;">
          <!-- Language Switcher -->
          <div style="display: flex; gap: 3px; margin-bottom: 8px; justify-content: flex-end;">
            <button class="lang-switch" data-lang="en" style="background: #e8e8e8; color: #666; border: none; padding: 5px 14px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600; opacity: 0.7; transition: all 0.2s ease;">EN</button>
            <button class="lang-switch" data-lang="ka" style="background: #1a1a1a; color: #fff; border: none; padding: 5px 14px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600; opacity: 1; transition: all 0.2s ease;">KA</button>
          </div>
          <!-- Biography Text -->
          <p id="bioText" style="margin: 0; font-size: 14px; line-height: 1.6; color: #333;"></p>
        </div>
      </div>
    </div>
    <div class="filter-tabs">
  <button class="pill" data-filter="all">ALL</button>
<button class="pill" data-filter="sale">SALE</button>
<button class="pill" data-filter="sold">SOLD</button>

</div>


    <div class="shop-grid shop-grid-small" id="shopGrid">


    </div> <!-- close #shopGrid -->

  </div> <!-- close .container -->
</section> <!-- close section -->


<!-- PRODUCT MODAL (same as shop) -->
<div class="product-modal" id="productModal">
  <div class="product-modal-box">

    <button class="product-close" id="productClose" aria-label="Close">✕</button>

    <div class="product-layout">

      <div class="product-left">
        <div class="product-gallery">
          <button class="gallery-arrow left" id="galleryPrev" aria-label="Previous photo">‹</button>
          <img id="productImg" src="" alt="Artwork" decoding="async" loading="lazy">
          <button class="gallery-arrow right" id="galleryNext" aria-label="Next photo">›</button>
        </div>
      </div>

      <div class="product-right">
        <h2 id="productTitle"></h2>
        <p class="muted" id="productDesc"></p>

        <ul class="product-info">
          <li><b>Size:</b> <span id="productSize"></span></li>
          <li><b>Medium:</b> <span id="productMedium"></span></li>
          <li><b>Year:</b> <span id="productYear"></span></li>
        </ul>

        <div class="product-buy">
          <div class="product-buy__price-row">
            <div class="product-price" id="productPrice">₾250</div>
          </div>

          <button class="morePhotosBtn" id="morePhotosBtn" type="button" aria-expanded="false">
            More photos <span class="arrow">↓</span>
          </button>

          <div class="product-thumbs-shell" id="productThumbsShell" aria-hidden="true">
            <div class="product-thumbs-shell__inner">
              <div class="product-thumbs" id="productThumbs"></div>
            </div>
          </div>

          <div class="product-modal-gift-card" id="frameSelectionCard" role="group" aria-labelledby="frameSelectionLabel">
            <div class="product-modal-gift-card__main">
              <span class="product-modal-gift-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16v11H4z"/><path d="M7.5 9.5h9v5h-9z"/></svg>
              </span>
              <div class="product-modal-gift-card__text">
                <span class="product-modal-gift-card__title" id="frameSelectionLabel">ჩარჩო</span>
                <span class="product-modal-gift-card__meta">+ €15</span>
              </div>
            </div>
            <label class="product-modal-gift-switch">
              <span class="product-modal-gift-switch__sr-only">ჩარჩო (+ €15)</span>
              <input type="checkbox" id="frameSelectionToggle" class="product-modal-gift-switch__input">
              <span class="product-modal-gift-switch__track"><span class="product-modal-gift-switch__thumb"></span></span>
            </label>
          </div>

          <div class="product-modal-gift-card" id="giftPackagingCard" role="group" aria-labelledby="giftPackagingLabel">
            <div class="product-modal-gift-card__main">
              <span class="product-modal-gift-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
              </span>
              <div class="product-modal-gift-card__text">
                <span class="product-modal-gift-card__title" id="giftPackagingLabel">სასაჩუქრე შეფუთვა</span>
                <span class="product-modal-gift-card__meta">+ €5</span>
              </div>
            </div>
            <label class="product-modal-gift-switch">
              <span class="product-modal-gift-switch__sr-only">სასაჩუქრე შეფუთვა (+ €5)</span>
              <input type="checkbox" id="giftPackagingToggle" class="product-modal-gift-switch__input">
              <span class="product-modal-gift-switch__track"><span class="product-modal-gift-switch__thumb"></span></span>
            </label>
          </div>

          <div class="product-modal-gift-card" id="courierDeliveryCard" role="group" aria-labelledby="courierDeliveryLabel">
            <div class="product-modal-gift-card__main">
              <span class="product-modal-gift-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="17" r="2.25"/><circle cx="17" cy="17" r="2.25"/><path d="M3 17h2"/><path d="M9.25 17h5.5"/><path d="M19 17h2"/><path d="M9.25 17 7 10H4"/><path d="M11 10h4.5l2.5 7"/><path d="M17.5 12H21l1 5"/></svg>
              </span>
              <div class="product-modal-gift-card__text">
                <span class="product-modal-gift-card__title" id="courierDeliveryLabel">საკურიერო მომსახურება</span>
                <span class="product-modal-gift-card__meta">+ €10</span>
              </div>
            </div>
            <label class="product-modal-gift-switch">
              <span class="product-modal-gift-switch__sr-only">საკურიერო მომსახურება (+ €10)</span>
              <input type="checkbox" id="courierDeliveryToggle" class="product-modal-gift-switch__input">
              <span class="product-modal-gift-switch__track"><span class="product-modal-gift-switch__thumb"></span></span>
            </label>
          </div>

          <button type="button" id="addToCartBtn" class="product-modal-add-cart" aria-label="Add to cart — inquire via WhatsApp">
            Add to Cart
          </button>

        </div>

      </div>

    </div>
  </div>
</div>



<!-- SCRIPT -->
<script defer src="../js/nv-gallery-modal.min.js?v=nv20260527"></script>
<script defer src="../script.min.js?v=nv20260527"></script>

<!-- data first -->
<script src="../data.min.js?v=nv20260527"></script>

<!-- artist shop renderer -->
<script src="artist-shop.min.js?v=nv20260527"></script>

</body>
</html>
